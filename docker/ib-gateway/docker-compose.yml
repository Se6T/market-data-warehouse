services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: unless-stopped
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD_FILE: /run/secrets/ib_password
      TWS_USERID_PAPER: ${TWS_USERID_PAPER:-${TWS_USERID}}
      TWS_PASSWORD_PAPER_FILE: /run/secrets/ib_password
      # This canonical stack is PAPER-only. LIVE trading uses the separate,
      # explicitly approved oquants-live stack; do not allow an inherited shell
      # variable to silently switch this container back to LIVE.
      TRADING_MODE: paper
      TWS_ACCEPT_INCOMING: ${TWS_ACCEPT_INCOMING:-accept}
      READ_ONLY_API: ${READ_ONLY_API:-no}
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
      TWOFA_TIMEOUT_ACTION: ${TWOFA_TIMEOUT_ACTION:-exit}
      RELOGIN_AFTER_TWOFA_TIMEOUT: ${RELOGIN_AFTER_TWOFA_TIMEOUT:-no}
      EXISTING_SESSION_DETECTED_ACTION: primary
    ports:
      - "127.0.0.1:${IB_LIVE_PORT:-4001}:4003"
      - "127.0.0.1:${IB_PAPER_PORT:-4002}:4004"
      - "127.0.0.1:${IB_VNC_PORT:-5900}:5900"
    secrets:
      - ib_password
    volumes:
      - ib-gateway-settings:/home/ibgateway/Jts
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/127.0.0.1/4004'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

secrets:
  ib_password:
    file: ${IB_PASSWORD_FILE:-./secrets/ib_password.txt}

volumes:
  ib-gateway-settings:
