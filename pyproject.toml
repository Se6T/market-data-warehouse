[project]
name = "market-data-warehouse"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.5.3",
    "exchange-calendars==4.13.2",
    "httpx==0.28.1",
    "ib-insync==0.9.86",
    "pyarrow==24.0.0",
    "requests==2.34.2",
    "rich==15.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "responses==0.26.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -v"
markers = [
    "integration: marks tests that use real DuckDB (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["clients", "scripts"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.",
    "pragma: no cover",
]
